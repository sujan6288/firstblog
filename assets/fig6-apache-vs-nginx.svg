<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">Apache versus Nginx comparison</title><desc id="desc">Comparison of Apache and Nginx across concurrency, configuration, dynamic content, modules and typical role.</desc>
  <style>text{font-family:Segoe UI,Arial,sans-serif;fill:#14213d}.h{font-weight:700;font-size:16px}.s{font-size:13px}.w{fill:#fff}</style>
  <rect width="600" height="400" rx="16" fill="#f4f7fb" stroke="#d5deea"/><g stroke="#d5deea" stroke-width="1" fill="#fff"><rect x="24" y="28" width="180" height="48"/><rect x="204" y="28" width="186" height="48"/><rect x="390" y="28" width="186" height="48"/><rect x="24" y="76" width="180" height="58"/><rect x="204" y="76" width="186" height="58"/><rect x="390" y="76" width="186" height="58"/><rect x="24" y="134" width="180" height="58"/><rect x="204" y="134" width="186" height="58"/><rect x="390" y="134" width="186" height="58"/><rect x="24" y="192" width="180" height="58"/><rect x="204" y="192" width="186" height="58"/><rect x="390" y="192" width="186" height="58"/><rect x="24" y="250" width="180" height="58"/><rect x="204" y="250" width="186" height="58"/><rect x="390" y="250" width="186" height="58"/><rect x="24" y="308" width="180" height="58"/><rect x="204" y="308" width="186" height="58"/><rect x="390" y="308" width="186" height="58"/></g>
  <rect x="204" y="28" width="186" height="48" fill="#d22128"/><rect x="390" y="28" width="186" height="48" fill="#009639"/><g class="h" text-anchor="middle"><text x="297" y="58" class="w">Apache</text><text x="483" y="58" class="w">Nginx</text></g><g class="s"><text x="38" y="110">Concurrency</text><text x="218" y="105">processes / threads</text><text x="404" y="105">event-driven workers</text><text x="38" y="168">Configuration</text><text x="218" y="163">.htaccess supported</text><text x="404" y="163">central configuration</text><text x="38" y="226">Dynamic content</text><text x="218" y="221">can run in-process</text><text x="404" y="221">passes to FastCGI</text><text x="38" y="284">Modules</text><text x="218" y="279">many dynamic modules</text><text x="404" y="279">compiled / selected</text><text x="38" y="342">Common role</text><text x="218" y="337">flexible app server</text><text x="404" y="337">static files / proxy</text></g>
</svg>
