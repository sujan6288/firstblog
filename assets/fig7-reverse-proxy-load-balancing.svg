<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Reverse proxy and load balancing</title>
  <desc id="d">Several clients connect to one reverse proxy, which terminates TLS, caches content and distributes requests across three backend application servers.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#14213D"/></marker>
  </defs>
  <style>text{font-family:"Segoe UI",Helvetica,Arial,sans-serif;fill:#14213D}.h{font-size:19px;font-weight:700}.s{font-size:15px}.w{fill:#FFFFFF}</style>
  <rect width="600" height="400" rx="16" fill="#F4F7FB" stroke="#D5DEEA"/>
  <g fill="#FFFFFF" stroke="#14213D" stroke-width="2">
    <rect x="20" y="90" width="90" height="56" rx="10"/><rect x="20" y="172" width="90" height="56" rx="10"/><rect x="20" y="254" width="90" height="56" rx="10"/>
  </g>
  <g class="s" text-anchor="middle">
    <text x="65" y="124">Client A</text><text x="65" y="206">Client B</text><text x="65" y="288">Client C</text>
  </g>
  <g stroke="#14213D" stroke-width="2.5" fill="none" marker-end="url(#a)">
    <line x1="110" y1="118" x2="198" y2="170"/>
    <line x1="110" y1="200" x2="198" y2="200"/>
    <line x1="110" y1="282" x2="198" y2="232"/>
  </g>
  <rect x="202" y="100" width="180" height="200" rx="12" fill="#1F6FEB"/>
  <text class="h w" x="292" y="136" text-anchor="middle">Reverse proxy</text>
  <text class="s w" x="292" y="160" text-anchor="middle">Apache or Nginx</text>
  <line x1="222" y1="176" x2="362" y2="176" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1.5"/>
  <text class="s w" x="292" y="206" text-anchor="middle">TLS termination</text>
  <text class="s w" x="292" y="232" text-anchor="middle">Caching</text>
  <text class="s w" x="292" y="258" text-anchor="middle">Load balancing</text>
  <text class="s w" x="292" y="284" text-anchor="middle">Access control</text>
  <g stroke="#14213D" stroke-width="2.5" fill="none" marker-end="url(#a)">
    <line x1="382" y1="170" x2="468" y2="100"/>
    <line x1="382" y1="200" x2="468" y2="200"/>
    <line x1="382" y1="230" x2="468" y2="300"/>
  </g>
  <g fill="#FFFFFF" stroke="#009639" stroke-width="2.5">
    <rect x="472" y="70" width="108" height="60" rx="10"/><rect x="472" y="170" width="108" height="60" rx="10"/><rect x="472" y="270" width="108" height="60" rx="10"/>
  </g>
  <g class="h" text-anchor="middle" style="font-size:16px;font-weight:700">
    <text x="526" y="96">App server</text><text x="526" y="196">App server</text><text x="526" y="296">App server</text>
  </g>
  <g class="s" text-anchor="middle">
    <text x="526" y="116">backend 1</text><text x="526" y="216">backend 2</text><text x="526" y="316">backend 3</text>
  </g>
  <text class="s" x="300" y="372" text-anchor="middle">Clients see one address; requests are spread across backends</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata>  <circle r="5" fill="#F5A623"><animateMotion dur="2s" begin="0s" repeatCount="indefinite" path="M110 118 L198 170"/></circle>
  <circle r="5" fill="#F5A623"><animateMotion dur="2s" begin="0.5s" repeatCount="indefinite" path="M110 200 L198 200"/></circle>
  <circle r="5" fill="#F5A623"><animateMotion dur="2s" begin="1.0s" repeatCount="indefinite" path="M110 282 L198 232"/></circle>
  <circle r="5" fill="#7EE787"><animateMotion dur="1.8s" begin="0.3s" repeatCount="indefinite" path="M382 170 L468 100"/></circle>
  <circle r="5" fill="#7EE787"><animateMotion dur="1.8s" begin="0.8s" repeatCount="indefinite" path="M382 200 L468 200"/></circle>
  <circle r="5" fill="#7EE787"><animateMotion dur="1.8s" begin="1.3s" repeatCount="indefinite" path="M382 230 L468 300"/></circle>
</svg>
