<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Web server infrastructure</title>
  <desc id="d">A client sends HTTP or HTTPS requests to a web server, which reads static files, forwards dynamic requests to an application, and the application queries a database.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#14213D"/></marker>
  </defs>
  <style>text{font-family:"Segoe UI",Helvetica,Arial,sans-serif;fill:#14213D}.h{font-size:19px;font-weight:700}.s{font-size:15px}.w{fill:#FFFFFF}</style>
  <rect width="600" height="400" rx="16" fill="#F4F7FB" stroke="#D5DEEA"/>
  <rect x="20" y="150" width="120" height="100" rx="12" fill="#FFFFFF" stroke="#14213D" stroke-width="2"/>
  <text class="h" x="80" y="193" text-anchor="middle">Client</text>
  <text class="s" x="80" y="216" text-anchor="middle">Browser or</text>
  <text class="s" x="80" y="234" text-anchor="middle">mobile app</text>
  <line x1="140" y1="200" x2="218" y2="200" stroke="#14213D" stroke-width="2.5" marker-end="url(#a)"/>
  <text class="s" x="179" y="190" text-anchor="middle">HTTP(S)</text>
  <rect x="222" y="90" width="150" height="190" rx="12" fill="#1F6FEB"/>
  <text class="h w" x="297" y="140" text-anchor="middle">Web server</text>
  <text class="s w" x="297" y="170" text-anchor="middle">Apache or Nginx</text>
  <text class="s w" x="297" y="205" text-anchor="middle">Listens on</text>
  <text class="s w" x="297" y="224" text-anchor="middle">ports 80 and 443</text>
  <rect x="222" y="290" width="150" height="48" rx="10" fill="#14213D"/>
  <text class="s w" x="297" y="311" text-anchor="middle">Operating system</text>
  <text class="s w" x="297" y="329" text-anchor="middle">+ hardware</text>
  <g stroke="#14213D" stroke-width="2.5" fill="none" marker-end="url(#a)">
    <line x1="372" y1="160" x2="446" y2="100"/>
    <line x1="372" y1="185" x2="446" y2="195"/>
  </g>
  <rect x="450" y="60" width="130" height="80" rx="12" fill="#FFFFFF" stroke="#14213D" stroke-width="2"/>
  <text class="h" x="515" y="95" text-anchor="middle">Static files</text>
  <text class="s" x="515" y="118" text-anchor="middle">HTML, CSS, images</text>
  <rect x="450" y="160" width="130" height="80" rx="12" fill="#FFFFFF" stroke="#14213D" stroke-width="2"/>
  <text class="h" x="515" y="195" text-anchor="middle">Application</text>
  <text class="s" x="515" y="218" text-anchor="middle">PHP, Python, Node</text>
  <line x1="515" y1="240" x2="515" y2="278" stroke="#14213D" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="450" y="282" width="130" height="80" rx="12" fill="#FFFFFF" stroke="#14213D" stroke-width="2"/>
  <text class="h" x="515" y="317" text-anchor="middle">Database</text>
  <text class="s" x="515" y="340" text-anchor="middle">MySQL, PostgreSQL</text>
  <text class="s" x="297" y="380" text-anchor="middle">Software that receives requests and returns responses</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata>  <circle r="5" fill="#F5A623"><animateMotion dur="1.6s" begin="0s" repeatCount="indefinite" path="M140 200 L218 200"/></circle>
  <circle r="5" fill="#F5A623"><animateMotion dur="2s" begin="0.4s" repeatCount="indefinite" path="M372 160 L446 100"/></circle>
  <circle r="5" fill="#F5A623"><animateMotion dur="2s" begin="0.9s" repeatCount="indefinite" path="M372 185 L446 195"/></circle>
  <circle r="5" fill="#F5A623"><animateMotion dur="1.4s" begin="0.7s" repeatCount="indefinite" path="M515 240 L515 278"/></circle>
</svg>
