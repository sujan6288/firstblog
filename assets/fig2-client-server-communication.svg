<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Client-server communication steps</title>
  <desc id="d">Five numbered steps between a client and a server: DNS lookup, TCP connection, TLS handshake, HTTP request, and HTTP response.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#14213D"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#009639"/></marker>
  </defs>
  <style>text{font-family:"Segoe UI",Helvetica,Arial,sans-serif;fill:#14213D}.h{font-size:20px;font-weight:700}.s{font-size:16px}.w{fill:#FFFFFF}</style>
  <rect width="600" height="400" rx="16" fill="#F4F7FB" stroke="#D5DEEA"/>
  <rect x="30" y="20" width="130" height="50" rx="10" fill="#1F6FEB"/>
  <text class="h w" x="95" y="53" text-anchor="middle">Client</text>
  <rect x="440" y="20" width="130" height="50" rx="10" fill="#14213D"/>
  <text class="h w" x="505" y="53" text-anchor="middle">Server</text>
  <line x1="95" y1="70" x2="95" y2="380" stroke="#9AA9BF" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="505" y1="70" x2="505" y2="380" stroke="#9AA9BF" stroke-width="2" stroke-dasharray="6 6"/>
  <g stroke="#14213D" stroke-width="2.5" fill="none">
    <line x1="95" y1="115" x2="495" y2="115" marker-end="url(#a)"/>
    <line x1="95" y1="175" x2="495" y2="175" marker-end="url(#a)"/>
    <line x1="95" y1="235" x2="495" y2="235" marker-end="url(#a)"/>
    <line x1="95" y1="295" x2="495" y2="295" marker-end="url(#a)"/>
  </g>
  <line x1="505" y1="350" x2="105" y2="350" stroke="#009639" stroke-width="2.5" marker-end="url(#b)"/>
  <g class="s">
    <text x="300" y="105" text-anchor="middle">1  DNS lookup: name to IP address</text>
    <text x="300" y="165" text-anchor="middle">2  TCP connection (3-way handshake)</text>
    <text x="300" y="225" text-anchor="middle">3  TLS handshake (HTTPS only)</text>
    <text x="300" y="285" text-anchor="middle">4  HTTP request: GET /index.html</text>
    <text x="300" y="340" text-anchor="middle" style="fill:#006B2A">5  HTTP response: 200 OK + content</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata>  <circle r="5" fill="#F5A623"><animateMotion dur="2.6s" begin="0s" repeatCount="indefinite" path="M95 115 L495 115"/></circle>
  <circle r="5" fill="#F5A623"><animateMotion dur="2.6s" begin="0.5s" repeatCount="indefinite" path="M95 175 L495 175"/></circle>
  <circle r="5" fill="#F5A623"><animateMotion dur="2.6s" begin="1.0s" repeatCount="indefinite" path="M95 235 L495 235"/></circle>
  <circle r="5" fill="#F5A623"><animateMotion dur="2.6s" begin="1.5s" repeatCount="indefinite" path="M95 295 L495 295"/></circle>
  <circle r="5" fill="#7EE787"><animateMotion dur="2.6s" begin="2.0s" repeatCount="indefinite" path="M505 350 L105 350"/></circle>
</svg>
