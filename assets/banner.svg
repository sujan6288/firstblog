<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Web Servers Explained banner</title>
  <desc id="d">Banner showing the title Web Servers Explained: Understanding Apache and Nginx with stylised server racks and network nodes.</desc>
  <style>
    @keyframes flow{to{stroke-dashoffset:-32}}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    .flow{stroke-dasharray:8 8;animation:flow 1.6s linear infinite}
    .led{animation:pulse 1.6s ease-in-out infinite}
    .led2{animation:pulse 1.6s ease-in-out .6s infinite}
    .node circle{animation:pulse 3s ease-in-out infinite}
    .node circle:nth-child(2n){animation-delay:.8s}
    .rack{animation:float 5s ease-in-out infinite}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1F3A"/>
      <stop offset="1" stop-color="#1F6FEB"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <g class="flow" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2" fill="none">
    <path d="M820 60 L960 120 L1100 70"/>
    <path d="M960 120 L900 230 L1040 240 L1100 70"/>
    <path d="M900 230 L820 60"/>
  </g>
  <g class="node" fill="#FFFFFF" fill-opacity="0.85">
    <circle cx="820" cy="60" r="9"/><circle cx="960" cy="120" r="12"/><circle cx="1100" cy="70" r="9"/>
    <circle cx="900" cy="230" r="9"/><circle cx="1040" cy="240" r="9"/>
  </g>
  <g class="rack"><g transform="translate(60 70)">
    <rect width="86" height="160" rx="10" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="2"/>
    <rect x="12" y="14" width="62" height="28" rx="5" fill="#FFFFFF" fill-opacity="0.25"/>
    <rect x="12" y="52" width="62" height="28" rx="5" fill="#FFFFFF" fill-opacity="0.25"/>
    <rect x="12" y="90" width="62" height="28" rx="5" fill="#FFFFFF" fill-opacity="0.25"/>
    <circle class="led" cx="62" cy="28" r="4" fill="#D22128"/><circle class="led2" cx="62" cy="66" r="4" fill="#00B050"/><circle class="led" cx="62" cy="104" r="4" fill="#00B050"/>
    <rect x="12" y="130" width="62" height="14" rx="4" fill="#FFFFFF" fill-opacity="0.18"/>
  </g></g>
  <text x="190" y="135" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="#FFFFFF">Web Servers Explained</text>
  <text x="192" y="185" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#CFE3FF">Understanding Apache and Nginx</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600">
    <rect x="192" y="212" width="92" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.15" stroke="#FFFFFF" stroke-opacity="0.5"/>
    <text x="238" y="235" text-anchor="middle" fill="#FFFFFF">HTTP</text>
    <rect x="296" y="212" width="100" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.15" stroke="#FFFFFF" stroke-opacity="0.5"/>
    <text x="346" y="235" text-anchor="middle" fill="#FFFFFF">HTTPS</text>
    <rect x="408" y="212" width="108" height="34" rx="17" fill="#D22128"/>
    <text x="462" y="235" text-anchor="middle" fill="#FFFFFF">Apache</text>
    <rect x="528" y="212" width="100" height="34" rx="17" fill="#009639"/>
    <text x="578" y="235" text-anchor="middle" fill="#FFFFFF">Nginx</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata>  <circle r="5" fill="#F5A623"><animateMotion dur="3.2s" begin="0s" repeatCount="indefinite" path="M820 60 L960 120 L1100 70"/></circle>
  <circle r="5" fill="#7EE787"><animateMotion dur="2.4s" begin="0.6s" repeatCount="indefinite" path="M900 230 L960 120"/></circle>
</svg>
