<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Nginx event-driven architecture</title>
  <desc id="d">An Nginx master process manages worker processes. Each worker runs an event loop that handles many connections using non-blocking I/O, serving files, proxying to upstream servers or passing requests to FastCGI.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#14213D"/></marker>
  </defs>
  <style>text{font-family:"Segoe UI",Helvetica,Arial,sans-serif;fill:#14213D}.h{font-size:19px;font-weight:700}.s{font-size:15px}.t{font-size:13px}.w{fill:#FFFFFF}@keyframes b{0%,100%{opacity:.3}50%{opacity:1}}
    .conn circle{animation:b 2.4s ease-in-out infinite}
    .conn circle:nth-child(3n){animation-delay:.4s}
    .conn circle:nth-child(3n+1){animation-delay:.9s}
    .conn circle:nth-child(5n){animation-delay:1.5s}
  </style>
  <rect width="600" height="400" rx="16" fill="#F4F7FB" stroke="#D5DEEA"/>
  <rect x="190" y="14" width="220" height="50" rx="10" fill="#009639"/>
  <text class="h w" x="300" y="37" text-anchor="middle">Master process</text>
  <text class="t w" x="300" y="55" text-anchor="middle">reads config, manages workers</text>
  <g stroke="#14213D" stroke-width="2.5" fill="none">
    <line x1="250" y1="64" x2="155" y2="98" marker-end="url(#a)"/>
    <line x1="350" y1="64" x2="445" y2="98" marker-end="url(#a)"/>
  </g>
  <rect x="20" y="102" width="270" height="190" rx="12" fill="#FFFFFF" stroke="#009639" stroke-width="2.5"/>
  <rect x="310" y="102" width="270" height="190" rx="12" fill="#FFFFFF" stroke="#009639" stroke-width="2.5"/>
  <text class="h" x="155" y="128" text-anchor="middle">Worker process</text>
  <text class="h" x="445" y="128" text-anchor="middle">Worker process</text>
  <rect x="40" y="142" width="230" height="40" rx="8" fill="#E1F4E8" stroke="#009639" stroke-width="1.5"/>
  <rect x="330" y="142" width="230" height="40" rx="8" fill="#E1F4E8" stroke="#009639" stroke-width="1.5"/>
  <text class="s" x="155" y="167" text-anchor="middle">Event loop (epoll / kqueue)</text>
  <text class="s" x="445" y="167" text-anchor="middle">Event loop (epoll / kqueue)</text>
  <g class="conn" fill="#1F6FEB">
    <circle cx="60" cy="212" r="9"/><circle cx="86" cy="212" r="9"/><circle cx="112" cy="212" r="9"/><circle cx="138" cy="212" r="9"/><circle cx="164" cy="212" r="9"/><circle cx="190" cy="212" r="9"/><circle cx="216" cy="212" r="9"/><circle cx="242" cy="212" r="9"/>
    <circle cx="73" cy="240" r="9"/><circle cx="99" cy="240" r="9"/><circle cx="125" cy="240" r="9"/><circle cx="151" cy="240" r="9"/><circle cx="177" cy="240" r="9"/><circle cx="203" cy="240" r="9"/>
    <circle cx="350" cy="212" r="9"/><circle cx="376" cy="212" r="9"/><circle cx="402" cy="212" r="9"/><circle cx="428" cy="212" r="9"/><circle cx="454" cy="212" r="9"/><circle cx="480" cy="212" r="9"/><circle cx="506" cy="212" r="9"/><circle cx="532" cy="212" r="9"/>
    <circle cx="363" cy="240" r="9"/><circle cx="389" cy="240" r="9"/><circle cx="415" cy="240" r="9"/><circle cx="441" cy="240" r="9"/><circle cx="467" cy="240" r="9"/><circle cx="493" cy="240" r="9"/>
  </g>
  <text class="t" x="155" y="278" text-anchor="middle">many connections, one worker</text>
  <text class="t" x="445" y="278" text-anchor="middle">many connections, one worker</text>
  <g stroke="#14213D" stroke-width="2.5" fill="none">
    <line x1="155" y1="292" x2="155" y2="312" marker-end="url(#a)"/>
    <line x1="445" y1="292" x2="445" y2="312" marker-end="url(#a)"/>
  </g>
  <rect x="20" y="316" width="560" height="56" rx="10" fill="#14213D"/>
  <text class="s w" x="300" y="338" text-anchor="middle">Non-blocking I/O: serve static files, proxy to upstream</text>
  <text class="s w" x="300" y="359" text-anchor="middle">servers, or pass requests to FastCGI (for example PHP-FPM)</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
